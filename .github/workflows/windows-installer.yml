# Compile l'installateur Windows x64 sur GitHub.
# La compilation croisée reprend l'environnement Fedora 45 / MinGW
# qui produit abiword.exe, libabiword-3.1.dll, OpenDocument, OpenXML
# et la correction Enchant/Hunspell. NSIS 3.13 est ensuite compilé sur Ubuntu :
# les stubs viennent de l'archive officielle, makensis est natif.
# Un push sur main remplace l'installateur de la release v3.1-windows.

name: Installateur Windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests natifs
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Installer les dépendances
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            autoconf automake libtool gettext-devel autoconf-archive \
            pkgconf-pkg-config pkgconf-m4 \
            make gcc gcc-c++ \
            boost-devel fribidi-devel glib2-devel libgsf-devel \
            wv-devel libxslt-devel libxml2-devel \
            gtk3-devel cairo-devel pango-devel librsvg2-devel \
            goffice-devel enchant2-devel \
            libjpeg-turbo-devel libpng-devel zlib-devel pcre2-devel \
            valgrind valgrind-devel \
            xorg-x11-server-Xvfb

      - name: Compiler et lancer la suite
        run: |
          NOCONFIGURE=1 ./autogen.sh
          mkdir -p build-tests
          cd build-tests
          ../configure --enable-plugins="opendocument openxml"
          make -j"$(nproc)"
          set +e
          xvfb-run -a make check
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "----- test-suite.log -----"
            cat src/wp/test/test-suite.log || true
            exit "$status"
          fi

  compile:
    name: Compilation MinGW
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Installer les outils de compilation
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            autoconf automake libtool gettext-devel autoconf-archive \
            pkgconf-pkg-config pkgconf-m4 \
            make gcc gcc-c++ patch \
            findutils gawk tar gzip which \
            mingw64-filesystem mingw64-binutils mingw64-gcc mingw64-gcc-c++ \
            mingw64-winpthreads \
            mingw64-boost mingw64-glib2 mingw64-enchant2 mingw64-hunspell \
            mingw64-fribidi mingw64-libgsf mingw64-libxml2 mingw64-libxslt \
            mingw64-libpng mingw64-libjpeg-turbo mingw64-zlib mingw64-bzip2 \
            mingw64-icu mingw64-pcre mingw64-pcre2 mingw64-libgcrypt mingw64-libgpg-error \
            mingw64-win-iconv mingw64-libffi \
            hunspell-fr hunspell-en hunspell-en-GB hunspell-en-US \
            hunspell-de hunspell-es hunspell-it hunspell-pt hunspell-nl \
            hunspell-pl hunspell-ru hunspell-sv hunspell-da hunspell-ca \
            hunspell-cs hunspell-el hunspell-hu hunspell-ro

      - name: Compiler wv 1.2.9
        env:
          PKG_CONFIG: /usr/bin/x86_64-w64-mingw32-pkg-config
        run: |
          curl -fsSL -o /tmp/wv.tar.gz \
            https://ftp.debian.org/debian/pool/main/w/wv/wv_1.2.9.orig.tar.gz
          tar -xzf /tmp/wv.tar.gz -C /tmp
          cd /tmp/wv-1.2.9
          patch -p1 < "$GITHUB_WORKSPACE/packaging/windows/wv-1.2.9-bounds.patch"
          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix=/usr/x86_64-w64-mingw32/sys-root/mingw \
            --disable-static
          make -j"$(nproc)"
          make install

      - name: Compiler Redland
        env:
          PKG_CONFIG: /usr/bin/x86_64-w64-mingw32-pkg-config
        run: |
          chmod +x packaging/windows/build-redland.sh
          packaging/windows/build-redland.sh

      - name: Configurer et compiler AbiWord
        env:
          PKG_CONFIG: /usr/bin/x86_64-w64-mingw32-pkg-config
          WINDRES: x86_64-w64-mingw32-windres
        run: |
          NOCONFIGURE=1 ./autogen.sh
          mkdir -p build
          cd build
          ../configure \
            --host=x86_64-w64-mingw32 \
            --prefix=/usr/x86_64-w64-mingw32/sys-root/mingw \
            --with-boost=/usr/x86_64-w64-mingw32/sys-root/mingw \
            --enable-plugins="opendocument openxml" \
            --with-redland \
            lt_cv_deplibs_check_method=pass_all \
            lt_cv_to_host_file_cmd=func_convert_file_noop
          # GCC annonce ses répertoires sous la forme lib/../lib.
          # Libtool croit alors que les archives .la ont été déplacées.
          sed -i 's|/lib/\.\./lib|/lib|g' libtool
          make -j"$(nproc)"

      - name: Assembler les fichiers à installer
        run: |
          chmod +x packaging/windows/stage-dist.sh
          packaging/windows/stage-dist.sh \
            "$PWD/build" \
            "$PWD/dist/windows-x86_64"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: dist/windows-x86_64
          retention-days: 1

  installer:
    name: Installateur NSIS
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: windows-dist
          path: dist/windows-x86_64

      - name: Installer NSIS 3.13
        run: |
          sudo apt-get update
          sudo apt-get install -y scons g++ zlib1g-dev unzip
          curl -fsSL -o /tmp/nsis-src.tar.bz2 \
            "https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13-src.tar.bz2/download"
          curl -fsSL -o /tmp/nsis.zip \
            "https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13.zip/download"
          unzip -q /tmp/nsis.zip -d "$HOME"
          tar -xjf /tmp/nsis-src.tar.bz2 -C /tmp
          scons -C /tmp/nsis-3.13-src \
            VERSION=3.13 \
            VER_MAJOR=3 \
            VER_MINOR=13 \
            SKIPSTUBS=all \
            SKIPPLUGINS=all \
            SKIPUTILS=all \
            SKIPMISC=all \
            NSIS_CONFIG_CONST_DATA_PATH=no \
            PREFIX="$HOME/nsis-3.13/Bin" \
            install-compiler
          echo "$HOME/nsis-3.13/Bin" >> "$GITHUB_PATH"
          echo "NSISDIR=$HOME/nsis-3.13" >> "$GITHUB_ENV"
          NSISDIR="$HOME/nsis-3.13" "$HOME/nsis-3.13/Bin/makensis" -VERSION

      - name: Créer l'installateur
        run: |
          major=$(sed -n 's/^m4_define(\[abi_version_major\], \[\([0-9]*\)\]).*/\1/p' configure.ac)
          minor=$(sed -n 's/^m4_define(\[abi_version_minor\], \[\([0-9]*\)\]).*/\1/p' configure.ac)
          version="${major}.${minor}"
          makensis \
            -DVERSION="$version" \
            -DDIST="$PWD/dist/windows-x86_64" \
            -DOUTFILE="$PWD/dist/AbiWord-${version}-windows-x64-setup.exe" \
            -DLICENSE="$PWD/COPYING" \
            -DICON_LICENSE="$PWD/src/wp/ap/win/ToolbarIcons/LICENSE.icons.txt" \
            -DNOTICES="$PWD/packaging/windows/THIRD-PARTY-NOTICES.txt" \
            -DICON="$PWD/src/wp/ap/win/abiword_app_32.ico" \
            packaging/windows/abiword.nsi
          echo "SETUP=dist/AbiWord-${version}-windows-x64-setup.exe" >> "$GITHUB_ENV"

      - name: Signer l'installateur si un certificat est fourni
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERT_BASE64}" ]; then
            echo "Aucun certificat WINDOWS_CERT_BASE64 : l'installateur reste non signé."
            exit 0
          fi
          sudo apt-get install -y osslsigncode
          echo "$WINDOWS_CERT_BASE64" | base64 -d > /tmp/abiword.pfx
          osslsigncode sign \
            -pkcs12 /tmp/abiword.pfx \
            -pass "$WINDOWS_CERT_PASSWORD" \
            -n "AbiWord" \
            -i "https://www.abisource.com/" \
            -in "$SETUP" \
            -out "${SETUP}.signed"
          mv "${SETUP}.signed" "$SETUP"
          rm -f /tmp/abiword.pfx

      - uses: actions/upload-artifact@v7
        with:
          name: AbiWord-windows-x64-setup
          path: dist/AbiWord-*-windows-x64-setup.exe
          retention-days: 30

      - name: Publier l'installateur
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v3.1-windows' }}
          UPDATE_NOTES: ${{ github.ref == 'refs/heads/main' && 'yes' || 'no' }}
        run: |
          base=$(basename "$SETUP")
          digest=$(sha256sum "$SETUP" | awk '{print $1}')
          bytes=$(wc -c < "$SETUP" | tr -d ' ')
          (
            cd "$(dirname "$SETUP")"
            sha256sum "$base"
          ) > "${SETUP}.sha256"
          gh release upload "$RELEASE_TAG" "$SETUP" "${SETUP}.sha256" --clobber
          if [ "$UPDATE_NOTES" != "yes" ]; then
            exit 0
          fi
          size=$(printf '%s' "$bytes" | python3 -c 'import sys; print(f"{int(sys.stdin.read()):,}".replace(",", " "))')
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/release-notes.md
          DIGEST="$digest" SIZE="$size" NAME="$base" SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import os, re
          digest = os.environ["DIGEST"]
          size = os.environ["SIZE"]
          name = os.environ["NAME"]
          sha = os.environ["SOURCE_SHA"]
          notes = open("/tmp/release-notes.md", encoding="utf-8").read()
          notes, n_src = re.subn(
              r"(?m)^Code source de l'installateur : `[^`]+`\.$",
              f"Code source de l'installateur : `{sha}`.",
              notes, count=1)
          notes, n_file = re.subn(
              r"(?m)^Installateur : `[^`]+` \([^)]+ octets\)\.$",
              f"Installateur : `{name}` ({size} octets).",
              notes, count=1)
          notes, n_hash = re.subn(
              r"(?m)^SHA-256 : `[0-9a-fA-F]+`$",
              f"SHA-256 : `{digest}`",
              notes, count=1)
          if n_src != 1 or n_file != 1 or n_hash != 1:
              raise SystemExit("notes de release : lignes de l'installateur introuvables")
          open("/tmp/release-notes.md", "w", encoding="utf-8").write(notes)
          PY
          gh release edit "$RELEASE_TAG" --notes-file /tmp/release-notes.md
          git fetch --depth=1 origin main
          git checkout -B publish-installer FETCH_HEAD
          DIGEST="$digest" SIZE="$size" SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import os, re
          digest = os.environ["DIGEST"]
          size = os.environ["SIZE"]
          sha = os.environ["SOURCE_SHA"]
          readme = open("README.md", encoding="utf-8").read()
          readme, a = re.subn(
              r"\| Taille \| [^|\n]*octets \|",
              f"| Taille | {size} octets |", readme, count=1)
          readme, b = re.subn(
              r"\| SHA-256 \| `[^`]+` \|",
              f"| SHA-256 | `{digest}` |", readme, count=1)
          readme, c = re.subn(
              r"\| Code source de ce binaire \| `[^`]+` \|",
              f"| Code source de ce binaire | `{sha}` |", readme, count=1)
          if a != 1 or b != 1 or c != 1:
              raise SystemExit("README : lignes de l'installateur introuvables")
          open("README.md", "w", encoding="utf-8").write(readme)
          PY
          git add README.md
          if git diff --cached --quiet; then
            echo "Le README cite déjà cet installateur."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Mettre à jour la taille et le condensat de l'installateur publié." \
              -m "Le binaire vient de ${SOURCE_SHA}."
          git push origin HEAD:main
